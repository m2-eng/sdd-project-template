# @spec: PROJ-SYS-005
name: CI – Spec Validator

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  validate-specs:
    name: Spec-Traceability prüfen
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements-dev.txt --quiet

      - name: Spec-Validator ausführen
        run: python scripts/validate_specs.py --root .
