name: Release Pipeline

on:
  push:
    tags:
      - 'baseline/v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Generate Allure report
        run: allure generate docs/test-reports/allure-results -o docs/test-reports/allure-report --clean

      - name: Export StrictDoc traceability matrix
        run: strictdoc export .

      - name: Package artifacts
        run: |
          zip -r allure-report.zip docs/test-reports/allure-report
          zip -r traceability.zip output

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PRERELEASE_FLAG=""
          if [[ "$TAG" == *"-alpha"* ]] || [[ "$TAG" == *"-beta"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$TAG" \
            $PRERELEASE_FLAG \
            --title "$TAG" \
            --notes "Automatisch erzeugt durch Release Pipeline" \
            allure-report.zip \
            traceability.zip \
            docs/test-reports/coverage.xml
