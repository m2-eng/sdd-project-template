# @spec: PROJ-SYS-003
# @spec: PROJ-SYS-006
name: Release Pipeline

on:
  push:
    tags:
      - 'baseline/v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest || [ $? -eq 5 ]

      - name: Install Allure CLI
        run: npm install -g allure-commandline@2.41.0

      - name: Generate Allure report
        run: |
          if [ -n "$(ls -A docs/test-reports/allure-results 2>/dev/null)" ]; then
            allure generate docs/test-reports/allure-results -o docs/test-reports/allure-report --clean
          else
            mkdir -p docs/test-reports/allure-report
          fi

      - name: Export StrictDoc traceability matrix
        run: strictdoc export .

      - name: Package artifacts
        run: |
          zip -r allure-report.zip docs/test-reports/allure-report
          zip -r traceability.zip output

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#baseline/}"
          PRERELEASE_FLAG=""
          if [[ "$TAG" == *"-alpha"* ]] || [[ "$TAG" == *"-beta"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          COVERAGE_ARG=""
          if [ -f docs/test-reports/coverage.xml ]; then
            COVERAGE_ARG="docs/test-reports/coverage.xml"
          fi
          # @spec: PROJ-SYS-010
          REVIEW_ARG=""
          if find docs/review -name "*.md" -maxdepth 1 | grep -q .; then
            zip -j "review-reports-${VERSION}.zip" docs/review/*.md
            REVIEW_ARG="review-reports-${VERSION}.zip"
          fi
          gh release create "$TAG" \
            $PRERELEASE_FLAG \
            --title "$TAG" \
            --notes "Automatisch erzeugt durch Release Pipeline" \
            allure-report.zip \
            traceability.zip \
            $COVERAGE_ARG \
            $REVIEW_ARG
